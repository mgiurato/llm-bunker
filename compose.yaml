services:
  bunker:
    image: ghcr.io/ggml-org/llama.cpp:server
    user: "1000:1000"

    # Docker Desktop's WSL2 VM only has ~15.6g total; 16g here would exceed
    # that, leaving no headroom for the proxy container or VM overhead.
    mem_limit: "12g"

    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/${MODEL_FILE:-MiniCPM-V-4_6-Q4_K_M.gguf}
      - --ctx-size
      - "32768"
      - --no-models-autoload
      - --reasoning
      - "off"
      - --no-agent
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0

    # No ports here on purpose: this network is internal, so the container
    # has zero route to the internet. Reach it only through the proxy below.

    volumes:
      - ./models:/models:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    networks:
      - bunker

  proxy:
    build:
      context: ./proxy

    # Reverse proxy to bunker's llama.cpp server: forwards requests as-is,
    # except it injects a system message with the live UTC date/time into
    # /v1/chat/completions requests, since the model otherwise has no clock
    # and no internet to check one.

    ports:
      - "127.0.0.1:8080:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    depends_on:
      - bunker

    networks:
      - bunker
      - front

networks:
  bunker:
    internal: true
  front:
